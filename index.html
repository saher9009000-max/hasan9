<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف برو — ضغط · تحويل · قص</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand"><span class="logo">◈</span> برو</div>
  <div class="header-actions">
    <button id="darkModeBtn" class="btn-icon" aria-label="الوضع الداكن">🌙</button>
    <button id="settingsBtn" class="btn-gear" aria-label="الإعدادات">⚙️</button>
    <div class="menu-container">
      <button id="menuBtn" class="btn-icon" aria-label="قائمة">⋮</button>
      <div id="menuPanel" class="menu-panel hidden">
        <div class="menu-row"><span>الإصدار</span><b>2.4.0</b></div>
        <div class="menu-row"><span>الحالة</span><b class="ok">متصل</b></div>
        <div class="menu-sep"></div>
        <div class="menu-row link" data-act="privacy">الخصوصية</div>
        <div class="menu-row link" data-act="api">واجهات API</div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="images">الصور</button>
    <button class="tab" data-tab="audio">الصوت</button>
    <button class="tab" data-tab="files">الملفات</button>
  </div>

  <!-- ==================== الصور ==================== -->
  <section id="tab-images" class="tab-content active">
    <div class="drop-zone" id="imageDrop">
      <p>اسحب الصور هنا أو انقر للاختيار</p>
      <span class="dz-hint">PNG · JPG · WEBP · GIF — حتى <span id="imgLimitLabel">400</span> م.ب</span>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
    </div>
    <div class="controls-card">
      <div class="control-row">
        <label>الصيغة الناتجة</label>
        <select id="imgFormat" class="rounded-input">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WEBP</option>
        </select>
      </div>
      <div class="control-row">
        <label>الجودة <b id="imgQualityVal">80%</b></label>
        <input type="range" id="imgQuality" min="30" max="100" value="80" class="range">
      </div>
      <div class="control-row">
        <label>حد الحجم (م.ب)</label>
        <input type="number" id="imgLimitInput" class="rounded-input" value="400" min="1">
      </div>
      <button class="btn-dark full" id="imgProcess">ضغط وتحويل</button>
    </div>
    <div id="imageResults" class="results"></div>
  </section>

  <!-- ==================== الصوت ==================== -->
  <section id="tab-audio" class="tab-content">
    <div class="drop-zone" id="audioDrop">
      <div class="dz-icon">🎵</div>
      <p>اسحب ملفات الصوت (يدعم الدفعات)</p>
      <span class="dz-hint">MP3 · WAV · M4A · OGG — حتى <span id="audLimitLabel">100</span> م.ب</span>
      <input type="file" id="audioInput" accept="audio/*" multiple hidden>
    </div>
    <div class="controls-card audio-editor-card">
      <div class="audio-top-bar">
        <div class="time-box" id="trimStartLabel">00:00</div>
        <div class="time-box" id="trimEndLabel">00:15</div>
        <button class="btn-icon-sm" id="audioResetBtn" aria-label="إعادة ضبط">🔄</button>
        <button class="btn-icon-sm" id="audioSaveBtn" aria-label="حفظ">💾</button>
      </div>
      <div class="waveform-container">
        <div class="timeline-ruler">
          <span>0:30</span><span>0:25</span><span>0:20</span><span>0:15</span><span>0:10</span><span>0:05</span>
        </div>
        <canvas id="audioCanvas" width="600" height="90"></canvas>
        <div class="trim-wrap" style="display:none;">
          <input type="range" id="trimStart" min="0" max="100" value="0" class="range">
          <input type="range" id="trimEnd" min="0" max="100" value="100" class="range">
        </div>
      </div>
      <div class="audio-player-controls">
        <button class="player-btn" id="audioZoomIn" aria-label="تكبير">➕</button>
        <button class="player-btn" id="audioRewind" aria-label="ترجيع">⏪</button>
        <button class="player-btn play-main" id="audioPlayBtn" aria-label="تشغيل">▶️</button>
        <button class="player-btn" id="audioForward" aria-label="تقديم">⏩</button>
        <button class="player-btn" id="audioZoomOut" aria-label="تصغير">➖</button>
      </div>
      <div class="control-row">
        <label>الجودة (kbps)</label>
        <select id="audioBitrate" class="rounded-input">
          <option value="64">64 — صغير</option>
          <option value="96">96 — متوازن</option>
          <option value="128" selected>128 — عالي</option>
          <option value="192">192 — احترافي</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-dark full" id="audioProcess">معالجة</button>
        <button class="btn-dark full ringtone" id="ringtoneBtn">📱 نغمة موبايل</button>
      </div>
    </div>
    <div id="audioResults" class="results"></div>
  </section>

  <!-- ==================== الملفات ==================== -->
  <section id="tab-files" class="tab-content">
    <div class="drop-zone" id="fileDrop">
      <div class="dz-icon">📦</div>
      <p>ضغط عام لأي ملف (GZIP)</p>
      <span class="dz-hint">حتى <span id="fileLimitLabel">100</span> م.ب</span>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <div class="controls-card">
      <div class="control-row">
        <label>حد الحجم (م.ب)</label>
        <input type="number" id="fileLimitInput" class="rounded-input" value="100" min="1">
      </div>
      <button class="btn-dark full" id="fileProcess">ضغط الملفات</button>
    </div>
    <div id="fileResults" class="results"></div>
  </section>
</main>

<!-- لوحة الإعدادات -->
<div id="settingsPanel" class="side-panel hidden">
  <div class="panel-head">
    <h3>سيتغ · الإعدادات</h3>
    <button id="settingsClose" class="btn-icon">✕</button>
  </div>
  <label>الجودة الافتراضية للصور <b id="setQ">80%</b>
    <input type="range" id="setQuality" class="range" min="30" max="100" value="80">
  </label>
  <label>حد الحجم العام (م.ب)
    <input type="number" id="setMaxSize" class="rounded-input" value="100"
