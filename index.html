<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ترجمة | Tarjama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 10. ترويسة الصفحة -->
    <header class="app-header">
        <div class="user-status">
            <span class="status-dot"></span>
            <div class="avatar">م</div>
        </div>
        <div class="logo-area">
            <h1 class="brand-text">ترجمة</h1>
            <div class="logo-icon"></div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="app-container">
        
        <!-- 3. عناصر التحكم باللغات -->
        <div class="lang-controls">
            <select class="neon-select" id="sourceLang">
                <option value="auto">اكتشاف تلقائي</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
            
            <button class="swap-btn neon-circle" id="swapBtn" title="تبديل اللغات">⇄</button>
            
            <select class="neon-select" id="targetLang">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>

        <!-- 4 & 5. أنماط الترجمة والأوضاع الإضافية -->
        <div class="modes-container">
            <div class="style-modes">
                <button class="mode-pill active" data-mode="literal">دقيقة وباشرة</button>
                <button class="mode-pill" data-mode="fluent">طبيعية وسلسة</button>
                <button class="mode-pill" data-mode="formal">رسمية</button>
            </div>
            <div class="extra-modes">
                <label class="neon-toggle">
                    <input type="checkbox" id="quietMode">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">هادئة</span>
                </label>
                <button class="ai-btn neon-pill" id="aiEnhance">✨ ترجمة بالذكاء الاصطناعي</button>
            </div>
        </div>

        <!-- 6. حقول الإدخال والاستيراد -->
        <div class="input-section">
            <div class="drop-zone neon-box" id="dropZone">
                <p>اسحب ملف (.txt, .docx, .pdf) أو انقر للاستيراد</p>
                <input type="file" id="fileInput" accept=".txt,.docx,.pdf" hidden>
            </div>
            <textarea class="neon-box main-input" id="sourceText" placeholder="اكتب أو الصق النص هنا..."></textarea>
            <textarea class="neon-box summary-input" id="summaryText" placeholder="ملخص النص..." rows="2"></textarea>
        </div>

        <!-- 7. منطقة النتيجة -->
        <div class="output-section">
            <div class="result-header">
                <span>النتيجة</span>
                <div class="action-btns">
                    <button class="icon-btn neon-circle" title="نسخ">📋</button>
                    <button class="icon-btn neon-circle" title="تصدير">💾</button>
                </div>
            </div>
            <div class="neon-box result-display" id="mainResult">
                ستظهر الترجمة هنا...
            </div>
        </div>

        <!-- 8 & 9. مصفوفة النتائج (6 خانات) وأدواتها -->
        <div class="matrix-grid">
            <!-- سيتم توليدها عبر JavaScript -->
        </div>

    </main>

    <!-- 2. واجهة الفقاعة العائمة -->
    <div class="floating-bubble" id="transBubble">
        <div class="bubble-anchor"></div>
        <div class="bubble-content">
            <span class="bubble-text">ترجمة سريعة</span>
            <button class="bubble-close neon-circle">×</button>
        </div>
    </div>

    <!-- 10. أزرار عائمة (FABs) -->
    <div class="fab-container">
        <button class="fab-btn neon-circle" id="historyFab" title="السجل">🕒</button>
        <button class="fab-btn neon-circle" id="settingsFab" title="الإعدادات">⚙️</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
