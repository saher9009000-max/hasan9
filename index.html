<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ترجمة">
<meta name="application-name" content="ترجمة">
<title>ترجمة — منصة الترجمة الاحترافية</title>
<link rel="manifest" id="manifestLink">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شريط عدم الاتصال -->
<div class="offline-banner" id="offlineBanner" hidden>
  ⚠️ أنت غير متصل — الترجمة الجديدة تحتاج إنترنت، لكن الترجمات المحفوظة تعمل.
</div>

<!-- الترويسة -->
<header class="header">
  <div class="header-right">
    <div class="logo">ت</div>
    <div class="brand">ترجمة</div>
  </div>
  <div class="header-left">
    <button class="install-btn" id="installBtn" hidden title="تثبيت التطبيق">⬇ تثبيت</button>
    <button class="user-btn" id="userBtn" title="الحساب">م</button>
  </div>
</header>

<main class="main">

  <!-- صف اللغات -->
  <section class="lang-row">
    <div class="lang-field">
      <label>من</label>
      <select id="sourceLang">
        <option value="auto">🌐 اكتشاف تلقائي</option>
        <option value="ar">العربية</option>
        <option value="en">الإنجليزية</option>
        <option value="fr">الفرنسية</option>
        <option value="es">الإسبانية</option>
        <option value="de">الألمانية</option>
        <option value="tr">التركية</option>
        <option value="ru">الروسية</option>
      </select>
    </div>
    <button class="swap-btn" id="swapBtn" title="تبديل اللغات">⇄</button>
    <div class="lang-field">
      <label>إلى</label>
      <select id="targetLang">
        <option value="ar">العربية</option>
        <option value="en" selected>الإنجليزية</option>
        <option value="fr">الفرنسية</option>
        <option value="es">الإسبانية</option>
        <option value="de">الألمانية</option>
        <option value="tr">التركية</option>
        <option value="ru">الروسية</option>
      </select>
    </div>
  </section>

  <!-- إعدادات مفتاح API، موقع API، واختيار النموذج يدوياً -->
  <section class="api-config-section">
    <div class="config-grid">
      <div class="config-field">
        <label for="apiKeyInput">🔑 مفتاح API (API Key)</label>
        <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح الـ API هنا...">
      </div>
      <div class="config-field">
        <label for="apiUrlInput">🌐 موقع API (Endpoint URL)</label>
        <input type="text" id="apiUrlInput" placeholder="https://api.example.com/v1/translate">
      </div>
    </div>
    <div class="config-grid">
      <div class="config-field" style="grid-column: 1 / -1;">
        <label for="modelSelect">🤖 اختر النموذج يدوياً (Model)</label>
        <select id="modelSelect">
          <option value="" disabled selected>-- اختر النموذج يدوياً --</option>
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4-turbo">GPT-4 Turbo</option>
          <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
          <option value="mymemory-standard">MyMemory Standard API</option>
          <option value="custom-model">نموذج مخصص (Custom)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- أنماط الترجمة -->
  <section class="styles">
    <button class="pill active" data-style="precise">دقيقة وباشرة</button>
    <button class="pill" data-style="natural">طبيعية وسلسة</button>
    <button class="pill" data-style="formal">رسمية</button>
  </section>

  <!-- أوضاع إضافية -->
  <section class="toggles">
    <label class="toggle">
      <input type="checkbox" id="quietMode">
      <span class="slider"></span>
      <span class="toggle-label">🌿 هادئة</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="aiMode">
      <span class="slider"></span>
      <span class="toggle-label">✨ ذكاء اصطناعي</span>
    </label>
  </section>

  <!-- حقل الإدخال -->
  <section class="input-section">
    <textarea id="sourceText" placeholder="اكتب أو الصق النص هنا..." maxlength="5000"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 5000</div>
  </section>

  <!-- الملخص -->
  <textarea id="summaryText" class="summary" placeholder="ملخص أو توجيه إضافي (اختياري)..." maxlength="500"></textarea>

  <!-- أزرار التنفيذ -->
  <section class="actions">
    <button class="btn-import" id="importBtn">📎 استيراد</button>
    <input type="file" id="fileInput" accept=".txt" hidden>
    <button class="btn-translate" id="translateBtn">ترجم ✨</button>
  </section>

  <!-- معاينة الملف المستورد -->
  <div class="file-preview" id="filePreview" hidden></div>

  <!-- منطقة النتيجة -->
  <section class="result-section">
    <div class="result-toolbar">
      <button class="tool" id="copyResult">📋 نسخ</button>
      <button class="tool" id="ttsResult">🔊 استماع</button>
      <button class="tool" id="exportResult">⬇ تصدير</button>
    </div>
    <div class="result" id="mainResult">النتيجة ستظهر هنا...</div>
  </section>

  <!-- مصفوفة 6 نتائج -->
  <h3 class="section-title">البدائل الستة</h3>
  <section class="variants" id="variantsGrid"></section>

</main>

<!-- الفقاعة العائمة -->
<div class="bubble" id="bubble" role="button" aria-label="فتح الترجمة السريعة">ت</div>

<!-- لوحة الفقاعة -->
<div class="bubble-panel" id="bubblePanel">
  <div class="bubble-header">
    <span>⚡ ترجمة سريعة</span>
    <button class="bubble-close" id="bubbleClose">×</button>
  </div>
  <textarea id="bubbleInput" placeholder="نص سريع للترجمة..." maxlength="500"></textarea>
  <button class="btn-translate" id="bubbleTranslate">ترجم</button>
  <div class="bubble-result" id="bubbleResult"></div>
</div>

<!-- أزرار جانبية عائمة -->
<div class="side-buttons">
  <button class="side-btn" id="historyBtn" title="السجل">🕘</button>
  <button class="side-btn" id="settingsBtn" title="الإعدادات">⚙</button>
</div>

<!-- نافذة السجل -->
<div class="modal" id="historyModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🕘 السجل</h2>
      <button class="modal-close" data-close="historyModal">×</button>
    </div>
    <div class="modal-body" id="historyList"></div>
  </div>
</div>

<!-- نافذة الإعدادات -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>⚙ الإعدادات</h2>
      <button class="modal-close" data-close="settingsModal">×</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <label>حجم الخط</label>
        <input type="range" id="fontSize" min="14" max="22" value="16">
      </div>
      <div class="setting-row">
        <label>الصوت</label>
        <select id="ttsVoice"><option value="">افتراضي</option></select>
      </div>
      <div class="setting-row">
        <label>سرعة النطق</label>
        <input type="range" id="ttsRate" min="0.5" max="1.5" step="0.1" value="1">
      </div>
      <div class="setting-row">
        <label>مسح السجل</label>
        <button class="btn-mini" id="clearHistory">مسح</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
