<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ترجمة | Tarjama Pro</title>
    <!-- ربط ملف التنسيق -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة الأيقونات (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 10. ترويسة الصفحة -->
    <header class="app-header">
        <div class="logo-section">
            <h1 class="brand-name">ترجمة</h1>
            <div class="brand-logo"></div>
        </div>
        <div class="user-status">
            <span class="status-indicator"></span>
            <span class="user-label">متصل</span>
            <div class="avatar-circle">م</div>
        </div>
    </header>

    <main class="main-content">
        
        <!-- 3. عناصر التحكم باللغات (خانتان منفصلتان) -->
        <section class="language-controls">
            <div class="lang-box source-lang">
                <label>اللغة المصدر</label>
                <select id="sourceLangSelect">
                    <option value="auto">اكتشاف تلقائي </option>
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
            </div>

            <button class="swap-btn neon-circle" id="swapBtn" title="تبديل اللغات">
                <i class="fas fa-exchange-alt"></i>
            </button>

            <div class="lang-box target-lang">
                <label>اللغة الهدف</label>
                <select id="targetLangSelect">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                </select>
            </div>
        </section>

        <!-- 4 & 5. أنماط وأوضاع الترجمة -->
        <section class="modes-section">
            <div class="styles-group">
                <button class="mode-btn active" data-style="literal">دقيقة وباشرة</button>
                <button class="mode-btn" data-style="fluent">طبيعية وسلسة</button>
                <button class="mode-btn" data-style="formal">رسمية</button>
            </div>
            <div class="extra-toggles">
                <label class="neon-toggle">
                    <input type="checkbox" id="quietMode">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-text">وضع هادئة (مختصر)</span>
                </label>
                <button class="ai-enhance-btn neon-pill">
                    <i class="fas fa-robot"></i> ترجمة بالذكاء الاصطناعي
                </button>
            </div>
        </section>

        <!-- 6. حقول الإدخال والاستيراد (هيكلية جديدة ومنفصلة) -->
        <section class="input-area">
            
            <!-- حقل النص الرئيسي + زر الصق الذكي -->
            <div class="input-container main-input-wrapper">
                <textarea id="sourceText" class="neon-rounded-box main-textarea" placeholder="اكتب أو الصق النص هنا..."></textarea>
                <button id="smartPasteBtn" class="smart-paste-btn neon-circle" title="لصق ذكي بالـ AI">
                    <i class="fas fa-magic"></i>
                </button>
            </div>

            <!-- حقل الملخص المنفصل -->
            <div class="input-container summary-wrapper">
                <label>ملخص سريع (اختياري)</label>
                <textarea id="summaryText" class="neon-rounded-box summary-textarea" placeholder="أدخل ملخصاً للنص إذا لزم الأمر..."></textarea>
            </div>

            <!-- خانة إعدادات الذكاء الاصطناعي المنفصلة -->
            <div class="input-container ai-settings-wrapper">
                <label><i class="fas fa-sliders-h"></i> إعدادات نموذج الذكاء الاصطناعي</label>
                <div class="ai-config-box neon-rounded-box">
                    <div class="config-item">
                        <span>درجة الإبداع:</span>
                        <input type="range" min="0" max="1" step="0.1" value="0.7">
                    </div>
                    <div class="config-item">
                        <span>طول الرد:</span>
                        <select class="mini-select">
                            <option>متوازن</option>
                            <option>مطول</option>
                            <option>مختصر</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- استيراد الملفات -->
            <div class="file-import-zone neon-rounded-box" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>اسحب ملفات (.txt, .docx, .pdf) أو انقر للاستيراد</p>
                <input type="file" id="fileInput" hidden accept=".txt,.docx,.pdf">
            </div>

        </section>

        <!-- 7. منطقة النتيجة الرئيسية -->
        <section class="output-area">
            <div class="result-header">
                <h3>النتيجة النهائية</h3>
                <div class="result-actions">
                    <button class="icon-btn neon-circle" title="نسخ الكل"><i class="fas fa-copy"></i></button>
                    <button class="icon-btn neon-circle" title="تصدير"><i class="fas fa-file-export"></i></button>
                </div>
            </div>
            <div id="mainResult" class="neon-rounded-box result-display">
                ستظهر الترجمة الرئيسية هنا...
            </div>
        </section>

        <!-- 8 & 9. مصفوفة النتائج (تدفق عمودي - 3 صفوف فقط) -->
        <section class="results-matrix">
            <h3>بدائل مقترحة</h3>
            <div class="vertical-stack" id="matrixContainer">
                <!-- سيتم توليد الخانات الثلاثة هنا عبر JavaScript -->
            </div>
        </section>

    </main>

    <!-- 2. واجهة الفقاعة العائمة -->
    <div class="floating-bubble" id="transBubble">
        <div class="bubble-connector"></div>
        <div class="bubble-body">
            <span class="bubble-title">ترجمة فورية</span>
            <button class="bubble-close neon-circle">×</button>
        </div>
    </div>

    <!-- 10. أزرار عائمة ثابتة (FABs) -->
    <div class="fab-dock">
        <button class="fab-btn neon-circle" id="historyFab" title="سجل الترجمات">
            <i class="fas fa-history"></i>
        </button>
        <button class="fab-btn neon-circle" id="settingsFab" title="الإعدادات">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="app.js"></script>
</body>
</html>
