<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turquoise Translate Overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="demo">
    <header class="demo-head">
      <div>
        <h1>Turquoise Translate Overlay</h1>
        <p class="sub">حدد أي نص في الصفحة ثم اضغط الفقاعة الفيروزية للترجمة الفورية</p>
      </div>
      <button class="dots-header" id="dots" title="الإعدادات">⋮</button>
    </header>

        <header class="demo-head">
      <div>
        <h1>Turquoise Translate Overlay</h1>
        <p class="sub">حدد أي نص في الصفحة ثم اضغط الفقاعة الفيروزية للترجمة الفورية</p>
      </div>
      <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
        <button class="theme-toggle-btn" id="themeToggle" title="الوضع الداكن">🌙</button>
        <button class="dots-header" id="dots" title="الإعدادات">⋮</button>
      </div>
    </header>

    <main class="demo-main">
      <section class="card">
        <h2>أو اكتب / الصق نصاً</h2>
        <textarea id="inputText" rows="5" placeholder="اكتب النص هنا..."></textarea>
        <button id="translateBtn" class="btn-primary">ترجم النص</button>
      </section>
    </main>


    <footer class="demo-foot">
      <span>v1.0.0</span>
      <span>MIT License</span>
    </footer>
  </div>

  <!-- ============ Overlay ============ -->
  <div class="overlay" id="overlay">
    <button class="bubble" id="bubble" title="ترجمة">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h7M9 3v2c0 4.418-3.582 8-8 8"/>
        <path d="M5 9c0 5 4 7 8 7"/>
        <path d="M14 19l3.5-9 3.5 9"/>
        <path d="M15.5 16h5"/>
      </svg>
    </button>

    <button class="indicator" id="indicator" title="إظهار المترجم">‹</button>

    <div class="result" id="result"></div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <span>إعدادات الترجمة</span>
        <button class="close" id="closePanel" title="إغلاق">×</button>
      </div>
      <div class="panel-body">
        <div class="row">
          <label for="modeSel">وضع الترجمة</label>
          <select id="modeSel">
            <option value="normal">ترجمة عادية</option>
            <option value="ai">ترجمة بالذكاء الاصطناعي</option>
          </select>
        </div>

        <div class="row">
          <label for="srcSel">من (اليسار)</label>
          <select id="srcSel"></select>
        </div>

        <div class="row">
          <label for="tgtSel">إلى (اليمين)</label>
          <select id="tgtSel"></select>
        </div>

        <div id="apiSection">
          <div class="row">
            <label for="apiKey">مفتاح API</label>
            <div class="inline">
              <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
              <button id="saveKey">تحقق وحفظ</button>
            </div>
            <div class="hint" id="keyStatus"></div>
          </div>

          <div class="row">
            <label for="modelSel">النموذج</label>
            <div class="inline">
              <select id="modelSel"></select>
              <button id="addModel" title="أضف نموذجاً">+</button>
            </div>
            <div class="inline" style="margin-top:6px">
              <input type="text" id="newModel" placeholder="مثال: gpt-4o-mini" />
            </div>
          </div>
        </div>

        <div class="row">
          <label for="opacity">شفافية الفقاعة</label>
          <input type="range" id="opacity" min="0.3" max="1" step="0.04" />
        </div>

        <div class="row check">
          <label for="dark">الوضع الداكن</label>
          <input type="checkbox" id="dark" />
        </div>

        <div class="row check">
          <label for="notify">الإشعارات</label>
          <input type="checkbox" id="notify" />
        </div>

        <div class="row">
          <label>الإذونات والصلاحيات</label>
          <div class="inline">
            <button id="checkPermsBtn" type="button">فحص الإذونات</button>
          </div>
          <div class="hint" id="permStatus">الوضع العادي نشط</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
